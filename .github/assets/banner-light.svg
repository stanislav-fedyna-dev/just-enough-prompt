  <text x="70" y="178" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#16181D">just-enough-prompt</text>
  <text x="72" y="228" font-size="28" font-weight="600" fill="#6E56CF">Fix what your prompt is missing.</text>
  <text x="72" y="262" font-size="28" font-weight="600" fill="#6E56CF">Nothing more.</text>
  <text x="72" y="306" font-size="18" fill="#6A6F7A">Adds only the practices it needs, and shows why.</text>
