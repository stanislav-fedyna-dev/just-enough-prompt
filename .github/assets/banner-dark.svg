    <text x="1070" y="161" font-size="16" font-weight="600" fill="#D4CCFF">+ Tone</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.30s" dur="0.4s" fill="freeze"/>
    <rect x="1052" y="186" width="150" height="38" rx="19" fill="#2A2250" stroke="#A594F9" stroke-width="1.5" />
    <text x="1070" y="211" font-size="16" font-weight="600" fill="#D4CCFF">+ Length</text>
