<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>just-enough-prompt — Fix what your prompt is missing. Nothing more.</title>
  <rect x="1" y="1" width="1278" height="358" rx="18" fill="#0D1117" stroke="#262C36" stroke-width="2"/>
  <text x="72" y="112" font-size="15" font-weight="600" letter-spacing="3" fill="#8B949E">AGENT SKILL</text>
  <text x="70" y="178" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#E6EDF3">just-enough-prompt</text>
  <text x="72" y="228" font-size="28" font-weight="600" fill="#A594F9">Fix what your prompt is missing.</text>
  <text x="72" y="262" font-size="28" font-weight="600" fill="#A594F9">Nothing more.</text>
  <text x="72" y="306" font-size="18" fill="#8B949E">Adds only the practices it needs, and shows why.</text>
  <rect x="724" y="86" width="290" height="188" rx="14" fill="#161B22" stroke="#262C36" stroke-width="1.5"/>
  <circle cx="746" cy="110" r="5" fill="#3A414C"/><circle cx="764" cy="110" r="5" fill="#3A414C"/><circle cx="782" cy="110" r="5" fill="#3A414C"/>
  <text x="746" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E6EDF3">write an email</text>
  <text x="746" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E6EDF3">about the project</text>
  <text x="746" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E6EDF3">delay<tspan fill="#A594F9">▍</tspan></text>
  <path d="M1016,180 L1040,180" stroke="#3A414C" stroke-width="2" stroke-linecap="round"/>
  
